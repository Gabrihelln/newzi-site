# Nginx: newzi.app (site estático em /var/www/newzi-site).
# Copie para /etc/nginx/sites-available/newzi.app e ative com um link em sites-enabled.
# Depois rode o certbot (veja o README): ele acrescenta o HTTPS e o redirecionamento de http para https.

server {
    listen 80;
    listen [::]:80;
    server_name newzi.app www.newzi.app;

    root /var/www/newzi-site;
    index index.html;
    charset utf-8;

    # www.newzi.app vai para newzi.app.
    if ($host = www.newzi.app) {
        return 301 $scheme://newzi.app$request_uri;
    }

    # Arquivos do repositório que não são do site.
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location = /README.md { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
    }

    location ~* \.(png|ico)$ {
        expires 30d;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
