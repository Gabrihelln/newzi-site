# Nginx: newzi.app (site estático em /var/www/newzi-site).
# Fica em /etc/nginx/sites-available/newzi-site, com um link em sites-enabled.
# Usa o certificado do Let's Encrypt em /etc/letsencrypt/live/newzi.app (vale para newzi.app e www.newzi.app).

# http (www ou não) vai para https://newzi.app.
server {
    listen 80;
    listen [::]:80;
    server_name newzi.app www.newzi.app;
    return 301 https://newzi.app$request_uri;
}

# https://www.newzi.app vai para https://newzi.app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.newzi.app;

    ssl_certificate /etc/letsencrypt/live/newzi.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newzi.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://newzi.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name newzi.app;

    ssl_certificate /etc/letsencrypt/live/newzi.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newzi.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/newzi-site;
    index index.html;
    charset utf-8;

    # Arquivos do repositório que não são do site.
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }
    location = /README.md { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
    }

    location ~* \.(png|ico)$ {
        expires 30d;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
